<text x="440" y="390" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0C447C">Pathway Agent</text>
<text x="440" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#185FA5">Therapy + specialists</text>

<!-- Pillar 2 — Daily Support -->
<rect x="580" y="238" width="320" height="200" rx="14" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="740" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#27500A">PILLAR 2 — DAILY SUPPORT</text>
<text x="740" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3B6D11">Sequential · reads KB3</text>

<rect x="660" y="298" width="160" height="46" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1"/>
<text x="740" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#27500A">Intake Agent</text>
