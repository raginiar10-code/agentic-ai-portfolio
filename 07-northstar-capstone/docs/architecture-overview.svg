<text x="240" y="790" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#0F6674">parents · children</text>

<rect x="380" y="752" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#0F6674" stroke-width="1"/>
<text x="510" y="772" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0B4A53">Conversation &amp; Activity History</text>
<text x="510" y="790" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#0F6674">chat_messages · activity_log</text>

<rect x="670" y="752" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#0F6674" stroke-width="1"/>
<text x="770" y="772" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0B4A53">Critic Reviews — HITL</text>
<text x="770" y="790" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#0F6674">critic_reviews, self-scoped</text>

<!-- Memory feedback: Conversation History -> Router, routed through the left margin -->
<path d="M 460 752 L 460 694 L 70 694 L 70 321 L 248 321" fill="none" stroke="#0F6674" stroke-width="1.25" stroke-dasharray="6,4" marker-end="url(#arrowTeal)"/>
<text x="150" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#0B4A53">recent history</text>
<text x="150" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#0F6674">(memory)</text>

