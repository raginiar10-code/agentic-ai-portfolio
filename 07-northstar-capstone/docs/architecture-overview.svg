<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>NorthStar architecture — Phase 1 four pillars plus Phase 2 persistence and trust layer</title>
<desc>A parent logs in and consents before a Streamlit UI feeds two workflows, Ask NorthStar and Daily Support. Every agent response from both passes through a shared Safety Critic, which either lets it through with a transparency panel or suppresses it with a safe fallback message. Both outcomes are persisted to a SQLite-backed layer holding accounts and consent, conversation and activity history, and a self-scoped human-in-the-loop review queue of Critic verdicts. Recent conversation history feeds back into the Router so a follow-up question can resolve a condition mentioned earlier. All responses also feed a feedback loop of thumbs up or down, logged to LangSmith and a local file, driving a v1 to v2 improvement cycle.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#5F5E5A"/>
</marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#185FA5"/>
</marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#3B6D11"/>
</marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#854F0B"/>
</marker>
<marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#534AB7"/>
</marker>
<marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#44546A"/>
</marker>
<marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#0F6674"/>
</marker>
</defs>

<text x="500" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2C2A">NorthStar — architecture (Phase 1 four pillars + Phase 2 persistence layer)</text>

<!-- Account Gate (Phase 2) -->
