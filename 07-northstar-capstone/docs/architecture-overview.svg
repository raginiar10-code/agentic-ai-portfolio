<text x="740" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3B6D11">Suggests activity</text>

<line x1="200" y1="420" x2="360" y2="497" stroke="#185FA5" stroke-width="1" marker-end="url(#arrowBlue)"/>
<line x1="440" y1="420" x2="480" y2="497" stroke="#185FA5" stroke-width="1" marker-end="url(#arrowBlue)"/>
<line x1="740" y1="420" x2="620" y2="497" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrowGreen)"/>

<!-- Pillar 3 — Safety Critic -->
<rect x="260" y="498" width="480" height="80" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="500" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#633806">PILLAR 3 — SAFETY CRITIC</text>
<text x="500" y="542" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#854F0B">Shared gate · every response, every workflow</text>
<text x="500" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#633806">No diagnosis · Disclaimer · No overpromise · In scope · Correct (is_correct)</text>

<line x1="380" y1="578" x2="250" y2="617" stroke="#854F0B" stroke-width="1" marker-end="url(#arrowAmber)"/>
<text x="300" y="602" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#3B6D11">pass</text>
<line x1="620" y1="578" x2="750" y2="617" stroke="#854F0B" stroke-width="1" marker-end="url(#arrowAmber)"/>
<text x="700" y="602" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A32D2D">flag</text>

<rect x="100" y="618" width="300" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="250" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#27500A">Response shown to parent</text>
<text x="250" y="658" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3B6D11">+ transparency panel</text>

<rect x="600" y="618" width="300" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="750" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#791F1F">Response suppressed</text>
<text x="750" y="658" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#A32D2D">Safe fallback shown instead</text>

<!-- Pillar 5 — Persistence & Trust Layer (Phase 2) -->
