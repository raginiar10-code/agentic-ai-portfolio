<text x="500" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B3A55">ACCOUNT GATE (Phase 2)</text>
<text x="500" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#44546A">Login / Signup → explicit consent, before anything is stored</text>

<line x1="500" y1="110" x2="500" y2="136" stroke="#44546A" stroke-width="1" marker-end="url(#arrowSlate)"/>

<!-- Streamlit UI -->
<rect x="140" y="138" width="720" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="500" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">Streamlit UI</text>
<text x="500" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444441">Chat panel + sidebar (child profile, quick actions, review queue, observability)</text>

<line x1="350" y1="194" x2="350" y2="236" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="650" y1="194" x2="650" y2="236" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Pillar 1 — Ask NorthStar -->
