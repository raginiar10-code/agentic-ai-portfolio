<text x="320" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0C447C">PILLAR 1 — ASK NORTHSTAR</text>
<text x="320" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#185FA5">Hub-and-spoke · reads KB1, KB2 · calls directory_lookup</text>

