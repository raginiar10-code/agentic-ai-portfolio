<text x="500" y="738" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F6674">SQLite (northstar.db) · one account, one child profile, full conversation + verdict history</text>

<rect x="130" y="752" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#0F6674" stroke-width="1"/>
